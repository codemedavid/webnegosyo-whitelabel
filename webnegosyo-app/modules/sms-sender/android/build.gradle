plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smssender'
version = '0.1.0'

android {
  namespace "expo.modules.smssender"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // HeadlessJsTaskService hosts the SMS gateway's JS task. expo-modules-core
  // keeps react-android as an implementation detail, so declare it here (as
  // expo-font and expo-updates do).
  implementation 'com.facebook.react:react-android'
}
