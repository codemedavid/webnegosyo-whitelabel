appId: com.webnegosyo.admin
name: Operations - dashboard KPIs and period filters
---
# As a merchant, I want the dashboard to show today's takings and the live
# queue, so that I can see how the shift is going at a glance.
- runFlow:
    file: helpers/switch-view.yaml
    env:
      VIEW: Operations

# The revenue card and its two derived KPIs.
- assertVisible: "REVENUE · TODAY"
- assertVisible: "ORDERS"
- assertVisible: "AVG ORDER"

# Live-queue counters.
- assertVisible: "ACTIVE NOW"
- assertVisible: "DELIVERED"
- assertVisible: "ORDER QUEUE"

# Every period filter re-scopes the revenue card without dropping it.
- tapOn: "Yesterday"
- waitForAnimationToEnd
- assertVisible: "REVENUE · YESTERDAY"

- tapOn: "This Week"
- waitForAnimationToEnd
- assertVisible: "REVENUE.*"

- tapOn: "This Month"
- waitForAnimationToEnd
- assertVisible: "REVENUE.*"

- tapOn: "Today"
- waitForAnimationToEnd
- assertVisible: "REVENUE · TODAY"
