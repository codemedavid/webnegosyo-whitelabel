appId: com.webnegosyo.admin
---
# Opens one of the five fixed tabs of the merchant app.
#
# Every flow enters through here, so this is also where per-flow isolation is
# enforced: relaunching drops whatever screen the previous flow finished on and
# returns to the tab root. The launch deliberately does NOT clear state — that
# would sign the merchant out and cost the suite its session.
- launchApp
- waitForAnimationToEnd
# Debug builds raise the expo-dev-client menu on launch.
- tapOn:
    text: "Continue"
    optional: true

# The bar never changes shape: Home · Orders · POS · Reports · Manage. Tabs are
# addressed by their label; the accessibility role suffix varies by platform.
- tapOn:
    text: "${TAB}(, tab.*)?"
- waitForAnimationToEnd
