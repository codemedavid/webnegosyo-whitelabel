name: Build Merchant App (Android APK)

# Builds the merchant admin app (webnegosyo-app) as an installable .apk.
#
# Two runners, same EAS profile and the same remote keystore, so either output
# installs over an existing merchant install:
#
#   eas-cloud    - builds on EAS servers. Consumes the monthly EAS build quota.
#                  The `production-apk` profile pins `environment: production`,
#                  so the builder injects EXPO_PUBLIC_SUPABASE_* and the
#                  GOOGLE_SERVICES_JSON secret file itself.
#   github-local - `eas build --local`, compiling on the GitHub runner. Does NOT
#                  consume the EAS build quota, which is the whole point: it is
#                  the documented way to keep shipping once the free-plan
#                  allowance is spent. Costs GitHub Actions minutes instead.
#
# Local builds cannot read EAS env vars with Secret visibility, so the
# github-local path supplies GOOGLE_SERVICES_JSON from a GitHub secret. The two
# EXPO_PUBLIC_* vars are Plain-text visibility and still load from EAS.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Where to compile'
        required: false
        default: 'github-local'
        type: choice
        options:
          - github-local
          - eas-cloud
      # Only `production-apk` is offered: it is the one profile that both pins
      # `buildType: apk` and selects the `production` EAS environment, which is
      # where GOOGLE_SERVICES_JSON lives. `preview` has neither, so it would
      # fail at prebuild on the gitignored ./google-services.json fallback.
      profile:
        description: 'EAS build profile (must produce an APK)'
        required: false
        default: 'production-apk'
        type: choice
        options:
          - production-apk
      wait:
        description: 'eas-cloud only: wait and print the APK download link'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Android ${{ inputs.runner }}
    runs-on: ubuntu-latest
    # Cloud builds queue behind paid ones and the wait alone can run well past
    # an hour; a local RN release build takes roughly 20-40 minutes. The job
    # timeout has to cover the worst of both, or CI kills a healthy build.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webnegosyo-app/package-lock.json

      # Pinned rather than relying on the runner image default, so an image
      # bump cannot silently move the toolchain under the release build.
      - name: Setup JDK 17
        if: ${{ inputs.runner == 'github-local' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: webnegosyo-app
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # google-services.json is gitignored, so it is absent from the checkout,
      # and `eas build --local` cannot read the Secret-visibility EAS file var
      # that supplies it for cloud builds. Materialise it from a GitHub secret
      # and point app.config.ts at it via GOOGLE_SERVICES_JSON.
      - name: Restore google-services.json
        if: ${{ inputs.runner == 'github-local' }}
        working-directory: webnegosyo-app
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not set. A local build cannot read the Secret-visibility EAS file variable, so this secret is required. Set it with: base64 -i webnegosyo-app/google-services.json | gh secret set GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          node -e "require('./google-services.json'); console.log('google-services.json restored and parses as JSON')"

      - name: Build APK on this runner
        if: ${{ inputs.runner == 'github-local' }}
        working-directory: webnegosyo-app
        env:
          # Absolute: app.config.ts is evaluated from varying working
          # directories during prebuild, so a relative path can miss.
          GOOGLE_SERVICES_JSON: ${{ github.workspace }}/webnegosyo-app/google-services.json
        run: |
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --local \
            --non-interactive \
            --output "${{ github.workspace }}/webnegosyo-admin.apk"

      - name: Upload APK
        if: ${{ inputs.runner == 'github-local' }}
        uses: actions/upload-artifact@v4
        with:
          name: webnegosyo-admin-apk
          path: webnegosyo-admin.apk
          if-no-files-found: error
          retention-days: 30

      - name: Link the APK artifact
        if: ${{ inputs.runner == 'github-local' }}
        run: |
          SIZE=$(du -h "${{ github.workspace }}/webnegosyo-admin.apk" | cut -f1)
          {
            echo "## Android APK"
            echo ""
            echo "Built on the runner — no EAS build quota consumed."
            echo ""
            echo "- **Size:** $SIZE"
            echo "- **Download:** the \`webnegosyo-admin-apk\` artifact on [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK on EAS (wait)
        if: ${{ inputs.runner == 'eas-cloud' && inputs.wait }}
        working-directory: webnegosyo-app
        run: |
          set -o pipefail
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --wait \
            --json | tee build.json

      - name: Build APK on EAS (no wait)
        if: ${{ inputs.runner == 'eas-cloud' && !inputs.wait }}
        working-directory: webnegosyo-app
        run: |
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait

      - name: Publish EAS APK link
        if: ${{ inputs.runner == 'eas-cloud' && inputs.wait }}
        working-directory: webnegosyo-app
        run: |
          # --json writes the build array to stdout and all progress logs to
          # stderr, so build.json is clean JSON. Parse defensively anyway: a
          # throw here would fail the step and hide an otherwise-good build.
          read -r APK_URL BUILD_PAGE <<<"$(node -e "
            let b = {};
            try { b = require('./build.json')[0] || {}; } catch (e) {}
            const url = b.artifacts?.buildUrl || '-';
            const page = b.id
              ? 'https://expo.dev/accounts/itscodemedavid/projects/webnegosyo-app/builds/' + b.id
              : '-';
            process.stdout.write(url + ' ' + page);
          ")"
          # Steps run under `bash -e`, so every conditional here is a full `if`.
          # A trailing `cmd && echo ...` returns 1 whenever the test is false and
          # would kill the step on the success path.
          if [ "$APK_URL" = "-" ]; then APK_URL=""; fi
          if [ "$BUILD_PAGE" = "-" ]; then BUILD_PAGE=""; fi
          {
            echo "## Android APK"
            echo ""
            if [ -n "$APK_URL" ]; then
              echo "- **Download:** $APK_URL"
            else
              echo "- **Download:** not available — check the build page for the failure reason."
            fi
            if [ -n "$BUILD_PAGE" ]; then
              echo "- **Build page:** $BUILD_PAGE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload EAS build metadata
        if: ${{ always() && inputs.runner == 'eas-cloud' && inputs.wait }}
        uses: actions/upload-artifact@v4
        with:
          name: merchant-android-build
          path: webnegosyo-app/build.json
          if-no-files-found: ignore
