name: Build Merchant App (Android APK)

# Builds the merchant admin app (webnegosyo-app) as an installable .apk via EAS.
#
# The `production-apk` profile pins `environment: production`, so the EAS
# builder injects EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY and
# the GOOGLE_SERVICES_JSON secret file itself. Nothing app-specific needs to be
# mirrored into GitHub secrets — only EXPO_TOKEN, which authenticates the CLI.

on:
  workflow_dispatch:
    inputs:
      # Only `production-apk` is offered: it is the one profile that both pins
      # `buildType: apk` and selects the `production` EAS environment, which is
      # where GOOGLE_SERVICES_JSON lives. `preview` has neither, so it would
      # fail at prebuild on the gitignored ./google-services.json fallback.
      profile:
        description: 'EAS build profile (must produce an APK)'
        required: false
        default: 'production-apk'
        type: choice
        options:
          - production-apk
      wait:
        description: 'Wait for the build and print the APK download link'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Android ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webnegosyo-app/package-lock.json

      - name: Install dependencies
        working-directory: webnegosyo-app
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (wait)
        if: ${{ inputs.wait }}
        working-directory: webnegosyo-app
        run: |
          set -o pipefail
          npx eas-cli build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --wait \
            --json | tee build.json

      - name: Build APK (no wait)
        if: ${{ !inputs.wait }}
        working-directory: webnegosyo-app
        run: |
          npx eas-cli build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait

      - name: Publish APK link
        if: ${{ inputs.wait }}
        working-directory: webnegosyo-app
        run: |
          # --json emits an array of builds; a single-platform build has one entry.
          APK_URL=$(node -e "const b=require('./build.json')[0]||{};process.stdout.write(b.artifacts?.buildUrl||'')")
          BUILD_PAGE=$(node -e "const b=require('./build.json')[0]||{};process.stdout.write(b.id?'https://expo.dev/accounts/itscodemedavid/projects/webnegosyo-app/builds/'+b.id:'')")
          {
            echo "## Android APK"
            echo ""
            if [ -n "$APK_URL" ]; then
              echo "- **Download:** $APK_URL"
            else
              echo "- **Download:** not available — check the build page for the failure reason."
            fi
            [ -n "$BUILD_PAGE" ] && echo "- **Build page:** $BUILD_PAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build metadata
        if: ${{ always() && inputs.wait }}
        uses: actions/upload-artifact@v4
        with:
          name: merchant-android-build
          path: webnegosyo-app/build.json
          if-no-files-found: ignore
